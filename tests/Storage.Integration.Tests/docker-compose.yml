# Live servers for Storage.Integration.Tests. Start with:
#   docker compose -f tests/Storage.Integration.Tests/docker-compose.yml up -d
# then export the variables printed in README.md and run the test project.
services:
  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2022:22"
    environment:
      # user:password:uid:gid:writable-dir. The chroot root is read-only; "upload" is writable.
      SFTP_USERS: "cltest:cltest-pw:1001:1001:upload"
    volumes:
      # Test-only public keys for key-based authentication tests.
      - ./fixtures/test_ed25519.pub:/home/cltest/.ssh/keys/test_ed25519.pub:ro
      - ./fixtures/test_ed25519_encrypted.pub:/home/cltest/.ssh/keys/test_ed25519_encrypted.pub:ro

  ftp:
    image: delfer/alpine-ftp-server
    # vsftpd in this image occasionally dies right after startup ("process has died, quitting").
    restart: unless-stopped
    ports:
      - "2021:21"
      - "21000-21010:21000-21010"
    environment:
      USERS: "cltest|cltest-pw|/home/cltest|1001"
      ADDRESS: "127.0.0.1"
      MIN_PORT: "21000"
      MAX_PORT: "21010"

  webdav:
    image: bytemark/webdav
    ports:
      - "8080:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: cltest
      PASSWORD: cltest-pw

  # Cloud object-store emulators: no cloud account required.
  minio:
    # MinIO no longer publishes public images (quay.io and Docker Hub refuse pulls); pgsty/minio is a
    # community build of the same server, pinned so CI does not float.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    ports:
      - "9010:9000"
    environment:
      MINIO_ROOT_USER: cltest
      MINIO_ROOT_PASSWORD: cltest-pw-minio

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"

  gcs:
    image: fsouza/fake-gcs-server
    command: -scheme http -port 4443 -external-url http://127.0.0.1:4443 -backend memory
    ports:
      - "4443:4443"

  swift:
    image: openstackswift/saio
    ports:
      - "8082:8080"

  # HTTP (3128), SOCKS5 (1080) and SOCKS4 (1081) proxy. Proxy tests address servers by their
  # compose service names, which only resolve inside this network, so a passing test proves the
  # traffic really went through the proxy.
  proxy:
    image: gogost/gost
    command: -L http://:3128 -L socks5://:1080 -L socks4://:1081
    ports:
      - "3128:3128"
      - "1080:1080"
      - "1081:1081"

  # Copies of FTP and GCS whose advertised addresses are their service names, so passive data
  # connections and resumable-upload URLs also resolve through the proxy.
  ftp-internal:
    image: delfer/alpine-ftp-server
    # vsftpd in this image occasionally dies right after startup ("process has died, quitting").
    restart: unless-stopped
    environment:
      USERS: "cltest|cltest-pw|/home/cltest|1001"
      ADDRESS: "ftp-internal"
      MIN_PORT: "21000"
      MAX_PORT: "21010"

  gcs-internal:
    image: fsouza/fake-gcs-server
    command: -scheme http -port 4443 -external-url http://gcs-internal:4443 -backend memory

  # SSH bastion that allows TCP forwarding, for jump-host tests. It forwards to the "sftp" service.
  jump:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh
        RUN ssh-keygen -A
        RUN adduser -D jump && echo 'jump:jump-pw' | chpasswd
        # sshd keeps the first value it reads; the drop-in directory is included before Alpine's
        # own "AllowTcpForwarding no", so the settings go there.
        RUN mkdir -p /etc/ssh/sshd_config.d && printf 'PasswordAuthentication yes\nAllowTcpForwarding yes\n' > /etc/ssh/sshd_config.d/10-jump.conf
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    ports:
      - "2023:22"

  # FTPS with TLS required on control and data connections, using a self-signed certificate it
  # generates at startup. Certificate, public-key pin, and TLS-failure tests run against it.
  ftps:
    image: stilliard/pure-ftpd
    ports:
      - "2024:21"
      - "31000-31009:31000-31009"
    environment:
      PUBLICHOST: "127.0.0.1"
      FTP_USER_NAME: cltest
      FTP_USER_PASS: cltest-pw
      FTP_USER_HOME: /home/cltest
      FTP_PASSIVE_PORTS: "31000:31009"
      ADDED_FLAGS: "--tls=2"
      TLS_CN: localhost
      TLS_ORG: cltest
      TLS_C: US

  # WebDAV with Digest authentication.
  webdav-digest:
    image: bytemark/webdav
    ports:
      - "8081:80"
    environment:
      AUTH_TYPE: Digest
      USERNAME: cltest
      PASSWORD: cltest-pw

  # WebDAV over HTTPS: Caddy terminates TLS with a certificate from its own internal CA (untrusted
  # by the host) and forwards to the plain WebDAV server, for pinning and TLS-failure tests.
  webdav-tls:
    image: caddy:2.11.4-alpine
    command: caddy reverse-proxy --from https://localhost:443 --to webdav:80 --internal-certs
    ports:
      - "8443:443"

  # WebDAV over TLS 1.3 only that requires a client certificate from fixtures/mtls/client-ca.crt, for
  # mutual TLS, refused-client-certificate, and protocol-mismatch tests.
  webdav-mtls:
    image: caddy:2.11.4-alpine
    command: caddy run --config /mtls/Caddyfile --adapter caddyfile
    volumes:
      - ./fixtures/mtls:/mtls:ro
    ports:
      - "8444:443"
