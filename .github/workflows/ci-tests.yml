name: CI Tests

# The test matrix, callable from both the PR/push workflow and the release gate so the
# two can never drift apart. Publishing to nuget.org is irreversible, so the release
# must run exactly the checks a pull request runs - not a copy of them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The libraries reference CodeLogic from NuGet (CodeLogicFromNuGet=true), and the
      # test projects reference the libraries by ProjectReference — so no sibling
      # CodeLogic source clone is needed here.
      #
      # Live-service tests (SMTP, S3, Steam, Postgres, DNSBL/GeoIP, git remote, and the
      # MySQL2 DB facts) self-skip when their connection/env vars are absent, so this job
      # runs the full offline suite with no external infrastructure or secrets.
      - name: Run tests
        shell: bash
        run: |
          set -e
          fail=0
          for proj in tests/*/*.Tests.csproj; do
            echo "::group::dotnet test $proj"
            dotnet test "$proj" \
              --configuration Release \
              -p:CodeLogicFromNuGet=true \
              --logger "console;verbosity=normal" \
              || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # MySQL2 and PostgreSQL have large live suites that self-skip without a reachable
  # server. Before these jobs existed only their offline subset ran in CI, so the
  # majority of each suite was never exercised on a push. Mirrors mssql-integration.
  mysql2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cl_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CL_MYSQL2_TEST_HOST: 127.0.0.1
      CL_MYSQL2_TEST_PORT: '3306'
      CL_MYSQL2_TEST_DB: cl_test
      CL_MYSQL2_TEST_USER: root
      CL_MYSQL2_TEST_PASS: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MySQL2 tests
        run: dotnet test tests/MySQL2.Tests/MySQL2.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: cl_test_pw
          POSTGRES_DB: cl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CL_PG_TEST_HOST: 127.0.0.1
      CL_PG_TEST_PORT: '5432'
      CL_PG_TEST_DB: cl_test
      CL_PG_TEST_USER: postgres
      CL_PG_TEST_PASS: cl_test_pw
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run PostgreSQL tests
        run: dotnet test tests/PostgreSQL.Tests/PostgreSQL.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

  mssql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MSSQL_SA_PASSWORD: Your_strong_password123!
      CL_MSSQL_TEST_CONNECTION_STRING: Server=127.0.0.1,1433;Database=cl_test;User ID=sa;Password=Your_strong_password123!;Encrypt=False;TrustServerCertificate=True
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start SQL Server 2019
        shell: bash
        run: |
          docker run --name cl-mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" -p 1433:1433 -d mcr.microsoft.com/mssql/server:2019-latest
          for i in {1..60}; do
            if docker exec cl-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec cl-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID(N'cl_test') IS NULL CREATE DATABASE [cl_test]"

      - name: Run MSSQL tests
        run: dotnet test tests/MSSQL.Tests/MSSQL.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

  # Live FTP, SFTP and WebDAV servers plus MinIO, Azurite, fake-gcs-server and Swift SAIO for
  # CL.Storage, so every provider runs against a real protocol without a cloud account. The same compose file is used for local
  # runs, so CI and a developer machine exercise identical servers. Without the CL_STORAGE_TEST_*
  # variables the suite self-skips, which is what the windows job above sees.
  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CL_STORAGE_TEST_SFTP_HOST: 127.0.0.1
      CL_STORAGE_TEST_SFTP_PORT: '2022'
      CL_STORAGE_TEST_SFTP_USER: cltest
      CL_STORAGE_TEST_SFTP_PASS: cltest-pw
      CL_STORAGE_TEST_FTP_HOST: 127.0.0.1
      CL_STORAGE_TEST_FTP_PORT: '2021'
      CL_STORAGE_TEST_FTP_USER: cltest
      CL_STORAGE_TEST_FTP_PASS: cltest-pw
      CL_STORAGE_TEST_FTP_ROOT: home/cltest
      CL_STORAGE_TEST_WEBDAV_URL: http://127.0.0.1:8080/
      CL_STORAGE_TEST_WEBDAV_USER: cltest
      CL_STORAGE_TEST_WEBDAV_PASS: cltest-pw
      CL_STORAGE_TEST_S3_URL: http://127.0.0.1:9010
      CL_STORAGE_TEST_S3_ACCESSKEY: cltest
      CL_STORAGE_TEST_S3_SECRETKEY: cltest-pw-minio
      CL_STORAGE_TEST_AZURE_CONNECTION_STRING: UseDevelopmentStorage=true
      CL_STORAGE_TEST_GCS_URL: http://127.0.0.1:4443
      CL_STORAGE_TEST_SWIFT_AUTH_URL: http://127.0.0.1:8082/auth/v1.0
      CL_STORAGE_TEST_SWIFT_USER: test:tester
      CL_STORAGE_TEST_SWIFT_KEY: testing
      CL_STORAGE_TEST_PROXY_HOST: 127.0.0.1
      CL_STORAGE_TEST_FTPS_HOST: 127.0.0.1
      CL_STORAGE_TEST_FTPS_PORT: '2024'
      CL_STORAGE_TEST_FTPS_USER: cltest
      CL_STORAGE_TEST_FTPS_PASS: cltest-pw
      CL_STORAGE_TEST_WEBDAV_DIGEST_URL: http://127.0.0.1:8081/
      CL_STORAGE_TEST_WEBDAV_TLS_URL: https://localhost:8443/
      CL_STORAGE_TEST_WEBDAV_MTLS_URL: https://localhost:8444/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start storage servers and emulators
        shell: bash
        run: |
          docker compose -f tests/Storage.Integration.Tests/docker-compose.yml up -d --build
          for port in 2021 2022 2023 2024 8080 8081 8443 8444 9010 10000 4443 8082 3128 1080; do
            for i in {1..120}; do
              if (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then break; fi
              sleep 1
            done
          done
          # A published port accepts connections even when the server behind it has died, so wait
          # for the FTP greeting too (the FTP containers restart themselves if vsftpd dies at startup).
          for port in 2021 2024; do
            for i in {1..60}; do
              if timeout 3 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port && head -c 3 <&3" 2>/dev/null | grep -q 220; then break; fi
              sleep 1
            done
          done

      # The windows job above runs the unit suite too; running it here covers Linux-only paths such
      # as Unix permission bits and local symbolic links, which Windows cannot create without admin.
      - name: Run storage unit tests on Linux
        run: dotnet test tests/Storage.Tests/Storage.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

      - name: Run storage integration tests
        run: dotnet test tests/Storage.Integration.Tests/Storage.Integration.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

      - name: Server logs on failure
        if: failure()
        run: docker compose -f tests/Storage.Integration.Tests/docker-compose.yml logs
